<script>
// ====================== 金色粒子飘落动画 ======================
var canvas = document.getElementById('goldCanvas');
var ctx = canvas.getContext('2d');
var w, h;
var particles = [];
function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize',resize);
function Particle(){
    this.x = Math.random() * w;
    this.y = Math.random() * -h;
    this.r = Math.random() * 3 + 1;
    this.speedY = Math.random() * 2 + 1;
    this.speedX = (Math.random()-0.5)*0.8;
    this.opacity = Math.random()*0.5+0.3;
}
Particle.prototype.update = function(){
    this.y += this.speedY;
    this.x += this.speedX;
    if(this.y>h){
        this.y = Math.random()*-50;
        this.x = Math.random()*w;
    }
};
Particle.prototype.draw = function(){
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
    ctx.fillStyle = 'rgba(255, 215, 0, ' + this.opacity + ')';
    ctx.fill();
};
function initParticle(){
    particles = [];
    for(var i=0;i<80;i++){ particles.push(new Particle()); }
}
function animate(){
    ctx.clearRect(0,0,w,h);
    for(var i=0;i<particles.length;i++){
        particles[i].update();
        particles[i].draw();
    }
    requestAnimationFrame(animate);
}
initParticle();
animate();

// ====================== 背景音乐控制 ======================
var audio = document.getElementById('bgAudio');
var musicBtn = document.getElementById('musicBtn');
var musicPlay = false;
musicBtn.onclick = function(){
    if(!musicPlay){
        audio.play();
        musicBtn.innerHTML = "⏸";
        musicPlay = true;
    }else{
        audio.pause();
        musicBtn.innerHTML = "♪";
        musicPlay = false;
    }
};

// ====================== 请柬页面切换 ======================
function openInvite(){
    document.getElementById('detailBox').style.display = "block";
}
function closeInvite(){
    document.getElementById('detailBox').style.display = "none";
}

// ====================== 留言板（本地存储，本机刷新不消失） ======================
function getMessages(){
    var data = localStorage.getItem("qianjuMsg");
    return data ? JSON.parse(data) : [];
}
function renderMsg(){
    var listDom = document.getElementById("msgList");
    var msgs = getMessages();
    if(msgs.length === 0){
        listDom.innerHTML = '<div class="load-tip">暂时还没有祝福，期待您的留言</div>';
        return;
    }
    var html = "";
    for(var i=msgs.length-1;i>=0;i--){
        html += '<div class="msg-item"><span class="msg-name">' + msgs[i].name + '</span>：' + msgs[i].content + '</div>';
    }
    listDom.innerHTML = html;
}
function submitMessage(){
    var name = document.getElementById("msgName").value.trim();
    var content = document.getElementById("msgContent").value.trim();
    if(!name || !content){
        alert("请填写姓名和祝福语！");
        return;
    }
    var arr = getMessages();
    arr.push({name:name, content:content});
    localStorage.setItem("qianjuMsg", JSON.stringify(arr));
    document.getElementById("msgName").value = "";
    document.getElementById("msgContent").value = "";
    renderMsg();
    alert("祝福已提交，主人能看到您的留言！");
}
renderMsg();
</script>
